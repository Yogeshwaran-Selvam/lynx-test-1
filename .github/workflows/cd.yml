name: CD
on:
  workflow_run:
    workflows: [CI]
    branches: [main, master]
    types: [completed]
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Build and push Docker image
      run: |
        docker build -t ${{ github.sha }} .
        docker tag ${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/${{ github.sha }}
        docker push ${{ secrets.DOCKER_USERNAME }}/${{ github.sha }}
    - name: Deploy to production
      run: |
        ssh ${SECRETS.DEPLOY_HOST} 'docker pull ${{ secrets.DOCKER_USERNAME }}/${{ github.sha }}'
        ssh ${SECRETS.DEPLOY_HOST} 'docker run -d -p 3000:3000 ${{ secrets.DOCKER_USERNAME }}/${{ github.sha }}'
    - name: Health check
      run: curl http://localhost:3000
